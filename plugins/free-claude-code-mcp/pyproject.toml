[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "free-claude-code-mcp"
version = "1.0.0"
description = "MCP server integration for free-claude-code proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=0.8.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
free-claude-code-mcp = "mcp_server:main"
